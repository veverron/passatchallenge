<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Oskarin Passat Challenge</title>
<style>
html,body{margin:0;height:100%;background:#10151c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
// ====== Versio: kun tätä muutetaan, ennätys nollautuu ======
const VERSION='1';
const BEST_KEY='oskarin_passat_best_v'+VERSION;

const W=360,H=720;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let sc=1,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;sc=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);}
addEventListener('resize',resize);resize();

// ====== apurit ======
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=(n,d)=>n.toFixed(d===undefined?2:d).replace('.',',');
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function rr(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function tx(t,x,y,size,col,al,wt){ctx.font=(wt||'')+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function em(e,x,y,size){ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y);}
function wrap(t,maxw,size,wt){ctx.font=(wt||'')+' '+size+'px system-ui,sans-serif';const ws=t.split(' ');const lines=[];let cur='';for(const w of ws){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxw&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}
function bar(x,y,w,h,f,col){f=clamp(f,0,1);rr(x,y,w,h,h/2,'#2a303b');if(f>0)rr(x,y,Math.max(h,w*f),h,h/2,col);}
let BTN=[];
function button(label,x,y,w,h,col,fn,o){o=o||{};rr(x,y,w,h,12,o.disabled?'#555a63':col);tx(label,x+w/2,y+h/2,o.size||18,'#fff','center','bold');if(!o.disabled)BTN.push({x,y,w,h,fn});}

// ====== data ======
const ITEMS={
 akvaario:{n:'Akvaario',e:'🐠',w:2,h:2,wt:3,fr:1,col:'#4aa3c7',haz:{t:'jerk',l:'Kalat',k:1.0,fail:'Kalat kuolivat. Mureena katsoo sinua syyttävästi.'}},
 pakaste:{n:'Pakasteet',e:'🧊',w:2,h:1,wt:2,col:'#8fd3ee',haz:{t:'time',l:'Pakasteet',k:0.42,fail:'Pakasteet suli. Jäätelökakusta tuli keitto.'}},
 lonkero:{n:'Lonkerot',e:'🍹',w:2,h:1,wt:3,col:'#e8a23a',haz:{t:'time',l:'Lonkerot',k:0.38,fail:'Lonkerot lämpenivät. Eihän näitä kukaan juo haaleina.'}},
 taikina:{n:'Pullataikina',e:'🥣',w:1,h:1,wt:1,col:'#f1e3b5',haz:{t:'time',l:'Taikina',k:0.36,fail:'Taikina nousi ja täytti koko takakontin.'}},
 termos:{n:'Kahvitermos',e:'☕',w:1,h:1,wt:1,fr:1,col:'#c0804a',haz:{t:'jerk',l:'Kahvit',k:0.8,fail:'Kahvit läikkyivät. Anoppi pahoitti mielensä.'}},
 munat:{n:'Kananmunat',e:'🥚',w:1,h:1,wt:1,fr:1,col:'#f4efe0',haz:{t:'jerk',l:'Munat',k:1.1,fail:'Munat hajosivat. Munakeitto on valmis.'}},
 kuusi:{n:'Joulukuusi',e:'🎄',w:3,h:1,wt:1,col:'#3f9a52',haz:{t:'speed',l:'Neulaset',k:1.0,fail:'Kuusi on kalju. Neulaset lentelivät maantiellä.'}},
 kiuas:{n:'Kiuas',e:'🔥',w:2,h:2,wt:3,col:'#7a7f88'},
 muutto:{n:'Muuttolaatikot',e:'📦',w:2,h:1,wt:2,col:'#c9a36b'},
 kiekko:{n:'Jääkiekkavarusteet',e:'🏒',w:2,h:1,wt:2,col:'#5b6fc9'},
 pesukone:{n:'Pesukone',e:'🌀',w:2,h:2,wt:3,col:'#d9dde3'},
 vaunut:{n:'Lastenvaunut',e:'🍼',w:2,h:2,wt:1,col:'#e58fb0'},
 kitara:{n:'Kitara',e:'🎸',w:3,h:1,wt:1,fr:1,col:'#b5562f'},
 anoppi:{n:'Anoppi',e:'👵',w:1,h:3,wt:2,col:'#d9b8e8',anoppi:1}
};
const STORES={
 tokmanni:{n:'Tokmanni',at:'Tokmannilla',col:'#d4202a',offers:[{n:'Haravat',e:'🧹',w:3,h:1},{n:'Muoviämpärit',e:'🪣',w:2,h:2},{n:'Joulukoristeet',e:'🎁',w:2,h:2}]},
 lidl:{n:'Lidl',at:'Lidlissä',col:'#0050aa',offers:[{n:'Banaanilaatikko',e:'🍌',w:3,h:1},{n:'Vessapaperit',e:'🧻',w:2,h:2},{n:'Oluttarjous',e:'🍺',w:2,h:2}]},
 citymarket:{n:'Citymarket',at:'Cittarissa',col:'#2a8f3c',offers:[{n:'Kahvipaketit',e:'☕',w:3,h:1},{n:'Ruokakassit',e:'🛍️',w:2,h:2},{n:'Pyykinpesuaine',e:'🧴',w:2,h:2}]}
};
const JUNKCOL=['#b88a55','#c19a64','#a9794a','#caa371'];

// ruudukko
const CS=44,GX=48,GY=100,GC=6,GR=5;
const SX=48,SY=366;

const G={state:'title',round:1,pieces:[],junk:[],best:0,stopIdx:0,offer:null,stopT:0,result:null,stopOrder:[]};
G.best=parseInt(lsGet(BEST_KEY)||'0',10)||0;
let D=null;
let muted=false;

function mk(def,extra){return Object.assign({},def,{loc:'tray',x:0,y:0},extra||{});}
function occ(excl){const g=[];for(let y=0;y<GR;y++)g.push(new Array(GC).fill(0));G.junk.forEach(j=>{g[j.y][j.x]=-1;});G.pieces.forEach(p=>{if(p===excl||p.loc!=='grid')return;for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)g[p.y+k][p.x+i]=p;});return g;}
function occSeat(excl){const g=[[0,0],[0,0]];G.pieces.forEach(p=>{if(p===excl||p.loc!=='seat')return;for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)g[p.y+k][p.x+i]=p;});return g;}
function fitsGrid(p,x,y){if(x<0||y<0||x+p.w>GC||y+p.h>GR)return false;const g=occ(p);for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)if(g[y+k][x+i])return false;return true;}
function fitsSeat(p,x,y){if(p.anoppi)return false;if(x<0||y<0||x+p.w>2||y+p.h>2)return false;const g=occSeat(p);for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)if(g[y+k][x+i])return false;return true;}
function anyFit(p){const w=p.w,h=p.h;let ok=false;for(let r=0;r<2&&!ok;r++){p.w=r?h:w;p.h=r?w:h;for(let y=0;y<GR&&!ok;y++)for(let x=0;x<GC&&!ok;x++)if(fitsGrid(p,x,y))ok=true;}p.w=w;p.h=h;return ok;}
function carried(){return G.pieces.filter(p=>p.loc==='grid'||p.loc==='seat');}
function carriedWt(){return carried().reduce((s,p)=>s+p.wt,0);}

function genRound(n){
 const hazIds=Object.keys(ITEMS).filter(k=>ITEMS[k].haz),plainIds=Object.keys(ITEMS).filter(k=>!ITEMS[k].haz&&!ITEMS[k].anoppi);
 for(let attempt=0;attempt<400;attempt++){
  const nh=Math.min(3,1+ri(0,1)+(n>3?1:0));
  const total=Math.min(6,3+n);
  let ids=shuffle(hazIds.slice()).slice(0,nh).concat(shuffle(plainIds.slice()).slice(0,total-nh));
  const area=ids.reduce((s,k)=>s+ITEMS[k].w*ITEMS[k].h,0);
  if(area>17)continue;
  const pcs=ids.map(id=>mk(ITEMS[id],{id}));pcs.push(mk(ITEMS.anoppi,{id:'anoppi'}));
  const g=[];for(let y=0;y<GR;y++)g.push(new Array(GC).fill(0));
  let ok=true;
  const order=pcs.slice().sort((a,b)=>b.w*b.h-a.w*a.h);
  for(const p of order){
   const c=[];
   for(let r=0;r<2;r++){const w=r?p.h:p.w,h=r?p.w:p.h;if(r&&p.w===p.h)continue;
    for(let y=0;y+h<=GR;y++)for(let x=0;x+w<=GC;x++){let f=true;for(let i=0;i<w&&f;i++)for(let k=0;k<h;k++)if(g[y+k][x+i]){f=false;break;}if(f)c.push([x,y,w,h]);}}
   if(!c.length){ok=false;break;}
   const s=pick(c);for(let i=0;i<s[2];i++)for(let k=0;k<s[3];k++)g[s[1]+k][s[0]+i]=1;
  }
  if(!ok)continue;
  const free=[];for(let y=0;y<GR;y++)for(let x=0;x<GC;x++)if(!g[y][x])free.push([x,y]);
  shuffle(free);
  const slack=Math.max(2,5-n);
  G.junk=free.slice(slack).map(c=>({x:c[0],y:c[1],c:pick(JUNKCOL)}));
  pcs.forEach(p=>{if(p.w!==p.h&&Math.random()<0.5){const t=p.w;p.w=p.h;p.h=t;}});
  G.pieces=shuffle(pcs);
  return;
 }
 // varasuunnitelma: pelkkä anoppi + muutama laatikko
 G.junk=[];G.pieces=[mk(ITEMS.anoppi,{id:'anoppi'}),mk(ITEMS.muutto,{id:'muutto'}),mk(ITEMS.kiuas,{id:'kiuas'})];
}

function packQuality(){
 let pen=0;const gp=G.pieces.filter(p=>p.loc==='grid');
 gp.filter(p=>p.fr).forEach(f=>{gp.filter(h=>h.wt>=3).forEach(h=>{const colOverlap=h.x<f.x+f.w&&f.x<h.x+h.w;if(colOverlap&&h.y+h.h<=f.y)pen+=25;});});
 gp.filter(h=>h.wt>=3&&h.y<3).forEach(()=>{pen+=8;});
 return clamp(100-pen,0,100);
}

// ====== ääni ======
let AC=null,master=null,mus=null,humE=null,humEG=null,humB=null,humBG=null,nextT=0,mstep=0;
function initAudio(){
 if(AC)return;
 try{
  const AX=window.AudioContext||window.webkitAudioContext;if(!AX)return;
  AC=new AX();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  mus=AC.createGain();mus.gain.value=0.9;mus.connect(master);
  humE=AC.createOscillator();humE.type='sine';humEG=AC.createGain();humEG.gain.value=0;humE.connect(humEG);humEG.connect(master);humE.start();
  humB=AC.createOscillator();humB.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;humBG=AC.createGain();humBG.gain.value=0;humB.connect(f);f.connect(humBG);humBG.connect(master);humB.start();
  nextT=AC.currentTime+0.1;setInterval(sched,100);
 }catch(e){AC=null;}
}
function note(f,d,type,g,t){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0005,t+d);o.connect(gn);gn.connect(mus);o.start(t);o.stop(t+d+0.05);}
function sched(){
 if(!AC)return;
 while(nextT<AC.currentTime+0.3){
  const s=mstep,bar=Math.floor(s/8)%4,st=s%8;
  const roots=[110,87.31,130.81,98],r=roots[bar];
  const tri=bar===0?[0,3,7,12]:[0,4,7,12];
  if(st===0||st===3||st===4||st===6)note(r,0.22,'triangle',0.11,nextT);
  if(Math.random()<0.88)note(r*4*Math.pow(2,tri[[0,1,2,3,2,1,3,2][st]]/12),0.15,'square',0.022,nextT);
  if(st%2===1)note(2400,0.03,'square',0.006,nextT);
  nextT+=0.27;mstep++;
 }
}
function tone(f,d,type,g,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(g||0.12,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+0.02);}
function sfx(k){
 if(!AC)return;
 if(k==='pop')tone(520,0.08,'square',0.08,880);
 else if(k==='bump')tone(120,0.18,'sawtooth',0.18,40);
 else if(k==='engine'){tone(70,0.5,'sawtooth',0.15,160);}
 else if(k==='crash'){tone(200,0.5,'sawtooth',0.22,30);}
 else if(k==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'square',0.1),i*140));}
 else if(k==='fail'){[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'sawtooth',0.1),i*180));}
 else if(k==='msg')tone(880,0.15,'sine',0.12,1320);
 else if(k==='warn')tone(660,0.2,'square',0.1,440);
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:1;}
function humUpdate(){
 if(!AC||!D)return;const t=AC.currentTime;
 const on=G.state==='drive';
 const eOn=on&&D.mode==='e'?Math.min(0.045,D.v/130*0.05):0;
 const bOn=on&&D.mode==='b'?0.03+D.v/130*0.05:0;
 humEG.gain.setTargetAtTime(eOn,t,0.1);humE.frequency.setTargetAtTime(180+D.v*6,t,0.1);
 humBG.gain.setTargetAtTime(bOn,t,0.1);humB.frequency.setTargetAtTime(48+D.v*0.9,t,0.1);
}

// ====== kierros ======
function startRound(){genRound(G.round);G.state='pack';G.offer=null;sfx('pop');}

function startDrive(){
 const q=packQuality();
 const anIn=G.pieces.some(p=>p.anoppi&&p.loc==='grid');
 const legLen=4000;
 const order=shuffle(['tokmanni','lidl','citymarket']);
 const roundF=1+0.07*(G.round-1);
 D={t:0,dist:0,v:0,slider:0,mode:'e',batt:100,fuel:0,km:0,sat:clamp(100-(100-q)*0.5,30,100),satMax:100,
  hz:carried().filter(p=>p.haz).map(p=>({p,val:100})),anoppiIn:anIn,legLen,stopDists:[legLen,legLen*2,legLen*3],stopNames:order,stopIdx:0,
  endDist:legLen*4,objs:[],bubble:null,cd:{},shake:0,curveNow:false,roundF,offersDone:0,offerSkips:0,hirviCrash:0,sliderPid:null,hirviSaid:0,packQ:q,loadF:1};
 G.stopOrder=order;
 // esteet
 const nHir=Math.min(3,1+Math.floor(G.round/2));
 const legs=shuffle([0,1,2,3]).slice(0,nHir);
 legs.forEach(l=>{const d=l*legLen+rnd(1000,2900);D.objs.push({t:'hirvi',dist:d,warned:false,gone:false,leave:0});});
 const avoid=[...D.stopDists,...D.objs.filter(o=>o.t==='hirvi').map(o=>o.dist)];
 const near=d=>avoid.some(a=>Math.abs(a-d)<350);
 for(let d=ri(350,600);d<D.endDist;d+=ri(Math.max(150,300-G.round*15),Math.max(260,520-G.round*20))){if(!near(d))D.objs.push({t:'bump',dist:d,done:false});}
 for(let d=ri(700,1100);d<D.endDist-300;d+=ri(900,1500)){if(!near(d)&&!near(d+300))D.objs.push({t:'curve',dist:d,len:ri(220,360)});}
 const tf=Math.max(700,1500-G.round*60);
 for(let d=ri(500,900);d<D.endDist;d+=ri(tf-500,tf)){D.objs.push({t:'tesla',dist:d,said:false,said2:false,col:pick(['#e8e8ea','#b0132a','#1c1c1f','#c9ccd1'])});}
 D.objs.sort((a,b)=>a.dist-b.dist);
 G.state='drive';
 speak('Lähdetään! Rantaperkiöstä Nikkilään.',3,1);
}

function slopeAt(d){return 0.6*Math.sin(d/1100)+0.4*Math.sin(d/430+1);}

// ====== puheenvuorot ======
const L_BRAKE=['Vähän painaa nuo varusteet...','Heikin Teslassa voin istua pitemmälle.','Tämä jarrutus ei tuntunut hyvältä.'];
const L_BUMP=['Tämä ei ollut ennen näin kuoppainen.','Onkohan tämä nyt oikein?'];
const L_KIUAS=['Melko kova tuo kiuas.','Tuo kiuas ei ole vielä täysin kylmä.','Onko tämä nyt varmasti kytketty irti?','Kyllä tästä löylyt lähtee, jos vähän kolautetaan.'];
function speak(text,dur,prio){if(!D)return;if(D.bubble&&D.bubble.t>0.8&&(prio||0)<D.bubble.prio)return;D.bubble={text,t:dur||3.2,prio:prio||0};}
function sayCd(key,cd,text,prio,dur){if(!D)return;if(D.cd[key]&&D.t<D.cd[key])return;D.cd[key]=D.t+cd;speak(text,dur,prio);}
function hasItem(id){return carried().some(p=>p.id===id);}

function hurt(type,amt){D.hz.forEach(h=>{if(h.p.haz.t===type)h.val-=amt*h.p.haz.k;});}
function meltTime(dt,mult){D.hz.forEach(h=>{if(h.p.haz.t==='time')h.val-=h.p.haz.k*D.roundF*dt*mult;});}
function setMode(m,forced){
 if(!D)return;
 if(m==='e'&&D.batt<=0){speak('Akku on tyhjä.',2,1);return;}
 if(m===D.mode)return;
 D.mode=m;
 if(m==='b'){sfx('engine');speak('Heikin Teslalla pääsee pitemmälle.',3.6,3);}
}

// ====== ajopäivitys ======
function updateDrive(dt){
 const d=D;d.t+=dt;
 if(d.bubble){d.bubble.t-=dt;if(d.bubble.t<=0)d.bubble=null;}
 const s=d.slider,slope=slopeAt(d.dist);
 const coast=1.2+d.v*0.01;let a;
 if(s<0)a=s*55-coast;else{const vt=s*130;a=vt>d.v?Math.min(14,(vt-d.v)*0.5+1):-coast;}
 a-=slope*3;
 if(d.v<=0&&a<0)a=0;
 const pv=d.v;d.v=clamp(d.v+a*dt,0,140);
 const ae=dt>0?(d.v-pv)/dt:0,ja=Math.abs(ae);
 const dm=d.v/3.6*6*dt;d.dist+=dm;d.km=d.dist/1000;
 // epätasainen ajo
 hurt('jerk',Math.max(0,ja-10)*0.2*dt);
 if(ae<-30){sayCd('brake',5,pick(L_BRAKE),2);}
 if(d.v>95)hurt('speed',(d.v-95)*0.25*dt);
 meltTime(dt,1);
 // kaarteet
 d.curveNow=false;
 d.objs.forEach(o=>{if(o.t==='curve'&&d.dist>=o.dist&&d.dist<=o.dist+o.len)d.curveNow=true;});
 if(d.curveNow&&d.v>70){hurt('jerk',(d.v-70)*0.08*dt);
  if(d.v>90){if(hasItem('akvaario'))sayCd('curve',7,'Tuo mureena katsoo minua.',2);else sayCd('curve',7,'Hiljempaa kaarteessa, kiitos.',1);}}
 d.sat-=(Math.max(0,ja-14)*0.15+(d.curveNow?Math.max(0,d.v-85)*0.04:0))*dt;
 if(ja<6)d.sat=Math.min(d.satMax,d.sat+0.3*dt);
 // energia
 d.loadF=1+carriedWt()/40;const vr=d.v/80;
 if(d.mode==='e'){
  if(d.batt<=0){setMode('b',true);}
  else{
   let dr=(0.12+0.5*vr*vr)*d.loadF*d.roundF+Math.max(0,ae)*0.04+Math.max(0,slope)*0.5*vr;
   let rg=0;if(ae<0)rg+=Math.min(1.5,-ae*0.02);if(slope<0)rg+=-slope*0.4*vr;
   if(d.v<0.5)dr=0;
   d.batt=clamp(d.batt-(dr-rg)*dt,0,100);
   if(d.batt<=0)setMode('b',true);
  }
 }else{
  d.fuel+=(dm/1000)*0.065*d.loadF;
  d.batt=clamp(d.batt+Math.min(0.8,Math.max(0,-ae)*0.012)*dt,0,100);
 }
 // objektit
 d.objs.forEach(o=>{
  const rel=o.dist-d.dist;
  if(o.t==='bump'&&!o.done&&rel<=0){
   o.done=true;const hit=Math.pow(d.v/60,1.6);
   if(d.v>8){hurt('jerk',hit*5);d.sat-=hit*3;sfx('bump');d.shake=Math.min(1,hit*0.6);
    if(hasItem('kiuas')&&Math.random()<0.6)sayCd('bump',4,pick(L_KIUAS),1);else sayCd('bump',4,pick(L_BUMP),1);}
  }
  else if(o.t==='hirvi'&&!o.gone){
   if(rel<700&&rel>0&&!o.warned){o.warned=true;sfx('warn');speak('Hirvi tiellä!',2.5,4);}
   if(rel<150&&rel>0&&d.v<8){o.leave+=dt;if(o.leave>1.2){o.gone=true;d.hirviSaid++;speak('Voi ei, onko hirvi kunnossa?',3.2,3);}}
   if(rel<=0){
    o.gone=true;
    if(d.v>=25){d.hirviCrash++;hurt('jerk',45);d.sat-=25;d.v=0;d.shake=1;sfx('crash');speak('Voi ei, onko hirvi kunnossa?',3.6,5);}
    else{hurt('jerk',8);d.sat-=6;d.v=Math.min(d.v,5);sfx('bump');speak('Voi ei, onko hirvi kunnossa?',3.2,3);}
   }
  }
  else if(o.t==='tesla'){
   if(rel<190&&rel>0&&!o.said){o.said=true;sayCd('tesla',2,'Onko se Heikki?',2,2.4);}
   if(rel<-40&&!o.said2){o.said2=true;if(Math.random()<0.5)sayCd('tesla2',3,'Ei ollut.',1,1.6);}
  }
 });
 // pysäkki / maali
 const target=d.stopIdx<3?d.stopDists[d.stopIdx]:d.endDist;
 if(d.dist>=target){
  if(d.stopIdx<3)arriveStop();else{finishWin();return;}
 }
 // tappioehdot
 for(const h of d.hz){if(h.val<=0){finishFail(h.p.haz.fail);return;}}
 if(d.anoppiIn&&d.sat<=0){finishFail('Anoppi jäi kyydistä pois ja kävelee kotiin.');return;}
 d.shake=Math.max(0,d.shake-dt*2.5);
}

function arriveStop(){
 const d=D,store=STORES[d.stopNames?d.stopNames[d.stopIdx]:G.stopOrder[d.stopIdx]];
 if(d.v>12){d.sat-=15;hurt('jerk',20);D.hz.forEach(h=>{if(h.p.haz.t==='time')h.val-=8;});sfx('crash');}
 d.v=0;d.slider=0;d.sliderPid=null;
 // tarjous
 const od=pick(store.offers);
 const offer=mk({n:od.n,e:od.e,w:od.w,h:od.h,wt:2,col:'#ffd166',offer:1},{id:'offer'});
 G.pieces.push(offer);G.offer=offer;G.store=store;G.stopT=0;
 G.pieces.forEach(p=>{if(p.anoppi)p.fixed=true;});
 // takakontti menee sekaisin: grid-tavarat uuteen järjestykseen
 jumble(offer);
 G.msg='Vaimo: "'+store.at+' on tarjouksessa '+od.n.toLowerCase()+'. Hae se mukaan!"';
 G.state='stop';sfx('msg');
}
function jumble(offer){
 const olds=G.pieces.filter(p=>!p.anoppi&&p.loc==='grid');
 const saved=olds.map(p=>({p,x:p.x,y:p.y,w:p.w,h:p.h}));
 for(let at=0;at<40;at++){
  olds.forEach(p=>{p.loc='tray';});
  let ok=true;
  for(const p of shuffle(olds.slice())){
   const c=[];const w0=p.w,h0=p.h;
   for(let r=0;r<2;r++){p.w=r?h0:w0;p.h=r?w0:h0;if(r&&w0===h0)continue;for(let y=0;y<GR;y++)for(let x=0;x<GC;x++)if(fitsGrid(p,x,y))c.push([x,y,p.w,p.h]);}
   if(!c.length){ok=false;p.w=w0;p.h=h0;break;}
   const s=pick(c);p.loc='grid';p.x=s[0];p.y=s[1];p.w=s[2];p.h=s[3];
  }
  if(ok&&!anyFit(offer))return;
  if(ok&&at===39)return;
 }
 saved.forEach(s=>{s.p.loc='grid';s.p.x=s.x;s.p.y=s.y;s.p.w=s.w;s.p.h=s.h;});
}

function onUp(id){
 if(G.state==='drive'&&D&&D.sliderPid===id){D.sliderPid=null;}
 if(drag&&drag.id===id){
  const p=drag.p,prev=drag.prev;const d=drag;drag=null;
  if(!d.moved&&performance.now()-d.t0<450){
   p.loc=prev.loc;p.x=prev.x;p.y=prev.y;const w=p.w,h=p.h;p.w=h;p.h=w;
   if(prev.loc==='grid'&&!fitsGrid(p,p.x,p.y)){p.w=w;p.h=h;}

  }
  const tlx=d.x-d.ox,tly=d.y-d.oy;
  const gx=Math.round((tlx-GX)/CS),gy=Math.round((tly-GY)/CS);
  const sx=Math.round((tlx-SX)/CS),sy=Math.round((tly-SY)/CS);
  p.loc='drag';
  if(fitsGrid(p,gx,gy)){p.loc='grid';p.x=gx;p.y=gy;sfx('pop');}
  else if(G.state==='stop'&&fitsSeat(p,sx,sy)){p.loc='seat';p.x=sx;p.y=sy;sfx('pop');}

  else{p.loc=prev.loc;p.x=prev.x;p.y=prev.y;p.w=prev.w;p.h=prev.h;}
 }
}

let last=performance.now();
function frame(t){

}
if(window.__TEST)window.__TEST.api={G,getD:()=>D,startRound,startDrive,updateDrive,updateStop,leaveStop,frame,onDown,onUp,onMove,setMode,genRound,packQuality};
