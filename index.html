<script>
(()=>{
'use strict';
// ====== Versio: kun tätä muutetaan, ennätys nollautuu ======
const VERSION='3';
const BEST_KEY='oskarin_passat_best_v'+VERSION;

const W=360,H=720;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let sc=1,dpr=1;
function resize(){dpr=window.devicePixelRatio||1;sc=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';cv.width=Math.round(W*sc*dpr);cv.height=Math.round(H*sc*dpr);}

// ====== apurit ======
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmt=(n,d)=>n.toFixed(d===undefined?2:d).replace('.',',');
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function hash(n){const s=Math.sin(n*12.9898)*43758.5453;return s-Math.floor(s);}

function rr(x,y,w,h,r,fill,stroke,lw){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}}
function tx(t,x,y,size,col,al,wt){ctx.font=(wt||'')+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';ctx.fillStyle=col||'#fff';ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y);}
function em(e,x,y,size){ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(e,x,y);}
function wrap(t,maxw,size,wt){ctx.font=(wt||'')+' '+size+'px system-ui,sans-serif';const ws=t.split(' ');const lines=[];let cur='';for(const w of ws){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxw&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}
function bar(x,y,w,h,f,col){f=clamp(f,0,1);rr(x,y,w,h,h/2,'#2a303b');if(f>0)rr(x,y,Math.max(h,w*f),h,h/2,col);}
function poly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();}
let BTN=[];
function button(label,x,y,w,h,col,fn,o){o=o||{};rr(x,y,w,h,12,o.disabled?'#555a63':col);tx(label,x+w/2,y+h/2,o.size||18,'#fff','center','bold');if(!o.disabled)BTN.push({x,y,w,h,fn});}

// ====== data ======
const ITEMS={
 klapit:{n:'Klapit',e:'🪵',w:3,h:2,wt:4,col:'#a0693a',must:1},
 akvaario:{n:'Akvaario',e:'🐠',w:2,h:2,wt:3,fr:1,col:'#4aa3c7',haz:{t:'jerk',l:'Kalat',k:1.0,fail:'Kalat kuolivat. Mureena katsoo sinua syyttävästi.'}},
 pakaste:{n:'Pakasteet',e:'🧊',w:2,h:1,wt:2,col:'#8fd3ee',haz:{t:'time',l:'Pakasteet',k:0.42,fail:'Pakasteet suli. Jäätelökakusta tuli keitto.'}},
 lonkero:{n:'Lonkerot',e:'🍹',w:2,h:1,wt:3,col:'#e8a23a',haz:{t:'time',l:'Lonkerot',k:0.38,fail:'Lonkerot lämpenivät. Eihän näitä kukaan juo haaleina.'}},
 taikina:{n:'Pullataikina',e:'🥣',w:1,h:1,wt:1,col:'#f1e3b5',haz:{t:'time',l:'Taikina',k:0.36,fail:'Taikina nousi ja täytti koko takakontin.'}},
 termos:{n:'Kahvitermos',e:'☕',w:1,h:1,wt:1,fr:1,col:'#c0804a',haz:{t:'jerk',l:'Kahvit',k:0.8,fail:'Kahvit läikkyivät. Anoppi pahoitti mielensä.'}},
 munat:{n:'Kananmunat',e:'🥚',w:1,h:1,wt:1,fr:1,col:'#f4efe0',haz:{t:'jerk',l:'Munat',k:1.1,fail:'Munat hajosivat. Munakeitto on valmis.'}},
 kuusi:{n:'Joulukuusi',e:'🎄',w:3,h:1,wt:1,col:'#3f9a52',haz:{t:'speed',l:'Neulaset',k:1.0,fail:'Kuusi on kalju. Neulaset lentelivät maantiellä.'}},
 kiuas:{n:'Kiuas',e:'🔥',w:2,h:2,wt:3,col:'#7a7f88'},
 muutto:{n:'Muuttolaatikot',e:'📦',w:2,h:1,wt:2,col:'#c9a36b'},
 kiekko:{n:'Jääkiekkavarusteet',e:'🏒',w:2,h:1,wt:2,col:'#5b6fc9'},
 pesukone:{n:'Pesukone',e:'🌀',w:2,h:2,wt:3,col:'#d9dde3'},
 vaunut:{n:'Lastenvaunut',e:'🍼',w:2,h:2,wt:1,col:'#e58fb0'},
 kitara:{n:'Kitara',e:'🎸',w:3,h:1,wt:1,fr:1,col:'#b5562f'},
 tikkaat:{n:'Tikkaat',e:'🪜',w:3,h:1,wt:1,col:'#d9a441'},
 sirkkeli:{n:'Pöytäsirkkeli',e:'🪚',w:2,h:1,wt:3,col:'#8a8f99'},
 anoppi:{n:'Anoppi',e:'👵',w:1,h:2,wt:2,col:'#d9b8e8',anoppi:1}
};
const STORES={
 tokmanni:{n:'Tokmanni',at:'Tokmannilla',col:'#d4202a',pool:['kuusi','vaunut','termos','taikina','muutto','akvaario']},
 lidl:{n:'Lidl',at:'Lidlissä',col:'#0050aa',pool:['pakaste','lonkero','munat','taikina','termos']},
 citymarket:{n:'Citymarket',at:'Cittarissa',col:'#2a8f3c',pool:['pakaste','munat','termos','kitara','kiekko','lonkero']},
 puuilo:{n:'Puuilo',at:'Puuilossa',col:'#f2b705',dark:1,pool:['kiuas','pesukone','tikkaat','sirkkeli','akvaario']}
};
const SENDERS=['Vaimo','Jouni','Anoppi','Heikki'];

// ruudukko (takakontti)
const CS=44,GX=48,GY=100,GC=6,GR=4;
const SX=224,SY=336;

const G={state:'title',round:1,pieces:[],junk:[],best:0,stopIdx:0,offers:[],store:null,stopT:0,result:null,msg:[],sender:'Vaimo'};
G.best=parseInt(lsGet(BEST_KEY)||'0',10)||0;
let D=null;
let muted=false;

function mk(def,extra){return Object.assign({},def,{loc:'tray',x:0,y:0},extra||{});}
function occ(excl){const g=[];for(let y=0;y<GR;y++)g.push(new Array(GC).fill(0));G.junk.forEach(j=>{g[j.y][j.x]=-1;});G.pieces.forEach(p=>{if(p===excl||p.loc!=='grid')return;for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)g[p.y+k][p.x+i]=p;});return g;}
function occSeat(excl){const g=[[0,0],[0,0]];G.pieces.forEach(p=>{if(p===excl||p.loc!=='seat')return;if(p.anoppi){g[0][0]=g[0][1]=g[1][0]=g[1][1]=p;return;}for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)g[p.y+k][p.x+i]=p;});return g;}
function fitsGrid(p,x,y){if(x<0||y<0||x+p.w>GC||y+p.h>GR)return false;const g=occ(p);for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)if(g[y+k][x+i])return false;return true;}
function fitsSeat(p,x,y){if(x<0||y<0||x+p.w>2||y+p.h>2)return false;const g=occSeat(p);for(let i=0;i<p.w;i++)for(let k=0;k<p.h;k++)if(g[y+k][x+i])return false;return true;}
function seatOk(p,sx,sy,tlx,tly){
 if(p.anoppi){if(Math.abs(tlx-SX)>70||Math.abs(tly-SY)>70)return false;const g=occSeat(p);return g.every(r=>r.every(c=>!c));}
 return fitsSeat(p,sx,sy);
}
function anyFit(p){const w=p.w,h=p.h;let ok=false;for(let r=0;r<2&&!ok;r++){p.w=r?h:w;p.h=r?w:h;for(let y=0;y<GR&&!ok;y++)for(let x=0;x<GC&&!ok;x++)if(fitsGrid(p,x,y))ok=true;}p.w=w;p.h=h;return ok;}
function carried(){return G.pieces.filter(p=>p.loc==='grid'||p.loc==='seat');}
function carriedWt(){return carried().reduce((s,p)=>s+p.wt,0);}
function isPlaced(p){return p.loc==='grid'||p.loc==='seat';}
function reqOk(){return G.pieces.filter(p=>p.must||p.anoppi||p.offer).every(isPlaced);}

function genRound(){
 // pyöräkotelot kiinteinä esteinä
 G.junk=[{x:0,y:2,c:'#4a4f58'},{x:GC-1,y:2,c:'#4a4f58'}];
 G.pieces=[mk(ITEMS.klapit,{id:'klapit'})];
}

function packQuality(){
 let pen=0;const gp=G.pieces.filter(p=>p.loc==='grid');
 gp.filter(p=>p.fr).forEach(f=>{gp.filter(h=>h.wt>=3).forEach(h=>{const colOverlap=h.x<f.x+f.w&&f.x<h.x+h.w;if(colOverlap&&h.y+h.h<=f.y)pen+=25;});});
 gp.filter(h=>h.wt>=3&&h.y<2).forEach(()=>{pen+=8;});
 return clamp(100-pen,0,100);
}

// ====== ääni: dekkarisarjan henkinen musiikki ======
let AC=null,master=null,mus=null,humE=null,humEG=null,humB=null,humBG=null,nextT=0,mstep=0,NB=null;
function initAudio(){
 if(AC)return;
 try{
  const AX=window.AudioContext||window.webkitAudioContext;if(!AX)return;
  AC=new AX();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
  mus=AC.createGain();mus.gain.value=0.9;mus.connect(master);
  NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.25),AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  humE=AC.createOscillator();humE.type='sine';humEG=AC.createGain();humEG.gain.value=0;humE.connect(humEG);humEG.connect(master);humE.start();
  humB=AC.createOscillator();humB.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;humBG=AC.createGain();humBG.gain.value=0;humB.connect(f);f.connect(humBG);humBG.connect(master);humB.start();
  nextT=AC.currentTime+0.1;setInterval(sched,100);
 }catch(e){AC=null;}
}
function note(f,d,type,g,t){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0005,t+d);o.connect(gn);gn.connect(mus);o.start(t);o.stop(t+d+0.05);}
function nz(t,d,g,hp){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const gn=AC.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(f);f.connect(gn);gn.connect(mus);s.start(t);s.stop(t+d+0.02);}
function kick(t){const o=AC.createOscillator(),gn=AC.createGain();o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+0.16);gn.gain.setValueAtTime(0.22,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(gn);gn.connect(mus);o.start(t);o.stop(t+0.22);}
// d-molli: Dm – Bb – Gm – A, kylmä syntikkabasso, tikittävä rytmi, harvakseltaan soiva lead
const BASS=[146.83,116.54,98.0,110.0];
const CHORD=[[0,3,7],[0,4,7],[0,3,7],[0,4,7]];
const BPAT=[1,0,1,1,0,1,0,1];
const LEAD=[[7,null,null,5,null,3,null,0],[2,null,5,null,null,7,null,null],[3,null,null,5,null,7,null,10],[11,null,9,null,null,7,null,4]];
function sched(){
 if(!AC)return;
 while(nextT<AC.currentTime+0.3){
  const s=mstep,bar=Math.floor(s/8)%4,st=s%8,t=nextT;
  const r=BASS[bar];
  if(BPAT[st])note(st===3||st===7?r*2:r,0.24,'sawtooth',0.07,t);
  if(st===0)CHORD[bar].forEach(c=>note(r*2*Math.pow(2,c/12),2.3,'triangle',0.02,t));
  const ld=LEAD[bar][st];
  if(ld!==null&&(Math.floor(s/32)%2===1||st!==7))note(293.66*Math.pow(2,ld/12),0.42,'square',0.026,t);
  if(st===0||st===4)kick(t);
  if(st===2||st===6)nz(t,0.12,0.05,1500);
  nz(t,0.03,0.014,6000);
  nextT+=0.3;mstep++;
 }
}
function tone(f,d,type,g,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(g||0.12,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+0.02);}
function sfx(k){
 if(!AC)return;
 if(k==='pop')tone(520,0.08,'square',0.08,880);
 else if(k==='bump')tone(120,0.18,'sawtooth',0.18,40);
 else if(k==='engine')tone(70,0.5,'sawtooth',0.15,160);
 else if(k==='crash')tone(200,0.5,'sawtooth',0.22,30);
 else if(k==='win')[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,'square',0.1),i*140));
 else if(k==='fail')[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'sawtooth',0.1),i*180));
 else if(k==='msg')tone(880,0.15,'sine',0.12,1320);
 else if(k==='warn')tone(660,0.2,'square',0.1,440);
 else if(k==='pass')tone(300,0.25,'sawtooth',0.07,120);
}
function setMute(m){muted=m;if(master)master.gain.value=m?0:1;}
function humUpdate(){
 if(!AC||!D)return;const t=AC.currentTime;
 const on=G.state==='drive';
 const eOn=on&&D.mode==='e'?Math.min(0.045,D.v/130*0.05):0;
 const bOn=on&&(D.mode==='h'||D.boostT>0.5)?0.03+D.v/130*0.05:0;
 humEG.gain.setTargetAtTime(eOn,t,0.1);humE.frequency.setTargetAtTime(180+D.v*6,t,0.1);
 humBG.gain.setTargetAtTime(bOn,t,0.1);humB.frequency.setTargetAtTime(48+D.v*0.9,t,0.1);
}

// ====== tie: kaarteet ja mäet (suljettu muoto, jotta ruudulla ei hyppyjä) ======
const SEGL=20,NSEG=60,Z0=30,YH=235,YB=478,KY=YB-YH,RW=170;
const KC=0.012/(SEGL*SEGL);
function curveAt(w){return 1.5*Math.sin(w/520)+0.8*Math.sin(w/173+1.3);}
function Xabs(w){return KC*(-1.5*520*520*Math.sin(w/520)-0.8*173*173*Math.sin(w/173+1.3));}
function Xd(w){return KC*(-1.5*520*Math.cos(w/520)-0.8*173*Math.cos(w/173+1.3));}
function slopeAt(w){return 0.6*Math.sin(w/1100)+0.4*Math.sin(w/430+1);}
function Iabs(w){return -0.6*1100*Math.cos(w/1100)-0.4*430*Math.cos(w/430+1);}

// ====== kierros ======
function startRound(){genRound();G.state='pack';sfx('pop');}

function startDrive(){
 const legLen=4000;
 const order=shuffle(Object.keys(STORES)).slice(0,3);
 const roundF=1+0.07*(G.round-1);
 D={t:0,dist:0,v:0,slider:0,mode:'e',batt:100,fuel:0,km:0,sat:100,satMax:100,
  hz:[],anoppiIn:false,legLen,stopDists:[legLen,legLen*2,legLen*3],stopNames:order,stopIdx:0,
  endDist:legLen*4,objs:[],cars:[],queue:[],bubble:null,cd:{},shake:0,curveNow:false,roundF,
  offersDone:0,offerSkips:0,gasId:null,brakeId:null,keyGas:false,keyBrake:false,gasP:0,brakeP:0,rough:0,clock:0,par:Math.max(150,200-4*(G.round-1)),heikkiN:0,loadF:1,carX:0.5,lane:0.5,boostT:0,
  spawnT:2,slowT:5,cutT:14,noteT:0,skipped:[]};
 G.state='drive';
 speak('Klapit kyydissä. Jouni odottaa Nikkilässä.',3.4,1,'o');
}

// ====== puheenvuorot ======
const L_BRAKE=['Vähän painaa nuo klapit...','Heikin Teslassa voin istua pitemmälle.','Tämä jarrutus ei tuntunut hyvältä.'];
const L_ROUGH=['Voisiko ajaa vähän tasaisemmin?','Kaikki kolisee tuolla takana.','Tämä on kuin ajaisi traktorilla.','Onkohan tämä nyt oikein?'];
const L_KIUAS=['Melko kova tuo kiuas.','Tuo kiuas ei ole vielä täysin kylmä.','Onko tämä nyt varmasti kytketty irti?','Kyllä tästä löylyt lähtee, jos vähän kolautetaan.'];
const L_TRUNK=['Klapi pistää selkään.','Onko tässä nyt varmasti turvallista?','Tämä ei ollut ennen näin ahdasta.'];
const L_SEAT=['Mukavaa, kun saa istua edessä.','Täällä on kyllä tilaa. Koko penkki minulle.'];
const T1=['Ei.','Ei oo.','Ei se ole Heikki.','Ei, anoppi.'];
const T2=['Joo oli se, sillä on tollanen afro nykyään.','Joo, Heikki osti uuden auton ja uuden naaman.','Aivan, ja tuo oli sen kaksoisveli.','Tuo on Toyota, anoppi.','Joo ja tuo oli sen kolmas Tesla.','Heikki on Orivedellä.','Kyllä, Heikki ajaa aina valkoisella.'];
const T3=['Ei. Ei. Ei.','Anoppi. Ei.','En kommentoi.','Heikki on edelleen Orivedellä.','... Joo. Se oli Heikki.','Heikki ei ole ajanut tähän suuntaan kertaakaan.'];
function speak(text,dur,prio,who){
 if(!D)return;who=who||'a';
 if(who==='a'&&!D.anoppiIn)return;
 if(D.bubble&&D.bubble.t>0.8&&(prio||0)<D.bubble.prio)return;
 D.bubble={text,t:dur||3.2,prio:prio||0,who};
}
function speakAt(delay,text,dur,prio,who){D.queue.push({at:D.t+delay,text,dur,prio,who});}
function sayCd(key,cd,text,prio,dur,who){if(!D)return;if(D.cd[key]&&D.t<D.cd[key])return;D.cd[key]=D.t+cd;speak(text,dur,prio,who);}
function hasItem(id){return carried().some(p=>p.id===id);}
function heikkiAsk(){
 const d=D;if(!d.anoppiIn)return;
 d.heikkiN++;
 const ask=d.heikkiN>6?pick(['Entä tuo, onko se Heikki?','Heikki taas!','Katso, Heikki!']):pick(['Onko se Heikki?','Onko tuo Heikki?','Heikki!? Onko se Heikki?']);
 speak(ask,2.4,3,'a');
 const tier=d.heikkiN<=2?T1:d.heikkiN<=6?T2:T3;
 speakAt(1.5,pick(tier),2.8,4,'o');
}

function hurt(type,amt){D.hz.forEach(h=>{if(h.p.haz.t===type)h.val-=amt*h.p.haz.k;});}
function meltTime(dt,mult){D.hz.forEach(h=>{if(h.p.haz.t==='time')h.val-=h.p.haz.k*D.roundF*dt*mult;});}
function setMode(m){
 if(!D)return;
 if(m==='e'&&D.batt<=0){speak('Akku on tyhjä.',2,1,'o');return;}
 if(m===D.mode)return;
 D.mode=m;
 if(m==='h'){sfx('engine');speak('Heikin Teslalla pääsee pitemmälle.',3.6,3,'a');}
}

// ====== liikenne ======
const CARTYPES=[
 {n:'Tesla Model 3',col:'#f4f4f6',white:1,w:3},{n:'Tesla Model Y',col:'#f6f6f8',white:1,w:3},
 {n:'Polestar 2',col:'#ececf0',white:1,w:1},{n:'VW ID.3',col:'#f2f2f4',white:1,w:1},{n:'Toyota Corolla',col:'#f0f0f0',white:1,w:2},
 {n:'Opel',col:'#b8202a',w:2},{n:'Audi',col:'#1b1b1f',w:2},{n:'Skoda',col:'#8d9aa6',w:2},{n:'Taksi',col:'#d9c58a',w:1},{n:'Volvo',col:'#2d4a3a',w:2},{n:'Rekka',col:'#2a62a8',big:1,w:1}
];
const SLOWTYPES=[{e:'🚜',n:'Traktori',kmh:30,col:'#3f8a3f'},{e:'🏕️',n:'Asuntovaunu',kmh:55,col:'#e8e8e8'},{e:'🛵',n:'Mopoauto',kmh:40,col:'#c9a227'},{e:'🚌',n:'Linja-auto',kmh:50,col:'#2d7fb8'},{e:'🚚',n:'Rekka',kmh:60,col:'#b0462f'}];
function pickCar(){const tot=CARTYPES.reduce((s,c)=>s+c.w,0);let r=Math.random()*tot;for(const c of CARTYPES){r-=c.w;if(r<=0)return c;}return CARTYPES[0];}
const VS=6/3.6; // km/h -> virtuaalimetriä/s

// ====== ajopäivitys ======
function updateDrive(dt){
 const d=D;d.t+=dt;d.clock+=dt;
 for(let i=d.queue.length-1;i>=0;i--){const q=d.queue[i];if(d.t>=q.at){d.queue.splice(i,1);speak(q.text,q.dur,q.prio,q.who);}}
 if(d.bubble){d.bubble.t-=dt;if(d.bubble.t<=0)d.bubble=null;}
 // polkimet: pitkä painallus nostaa tehoa vähitellen
 const gasOn=d.gasId!==null||d.keyGas,brOn=d.brakeId!==null||d.keyBrake;
 d.gasP=gasOn?Math.min(1,d.gasP+0.9*dt):Math.max(0,d.gasP-3*dt);
 d.brakeP=brOn?Math.min(1,d.brakeP+1.6*dt):Math.max(0,d.brakeP-4*dt);
 d.slider=d.brakeP>0.03?-d.brakeP:d.gasP;
 const E=d.mode==='e';
 // kaista
 const px=d.carX;d.carX+=clamp(d.lane-d.carX,-1.8*dt,1.8*dt);
 const vxl=dt>0?(d.carX-px)/dt:0;
 const s=d.slider,slope=slopeAt(d.dist);
 const vmax=E?110:130,amax=E?9:14;
 const coast=1.2+d.v*0.01;let a;
 if(s<0)a=s*55-coast;else{const vt=s*vmax;a=vt>d.v?Math.min(amax,(vt-d.v)*0.5+1):-coast;}
 a-=slope*3;
 if(d.v<=0&&a<0)a=0;
 const pv=d.v;d.v=clamp(d.v+a*dt,0,140);
 // hitaan auton perässä
 d.cars.forEach(c=>{if(c.t==='slow'){const rel=c.dist-d.dist;if(rel>0&&rel<45&&d.carX>0.05)d.v=Math.min(d.v,c.kmh+2);}});
 const ae=dt>0?(d.v-pv)/dt:0,ja=Math.abs(ae);
 const dm=d.v*VS*dt;d.dist+=dm;d.km=d.dist/1000;
 // epätasaisuus: kova kaasu/jarru, kaistanvaihdot, kaarteet
 const unev=Math.max(0,ja-10)*0.2+Math.abs(vxl)*(d.v/100)*2;
 hurt('jerk',unev*dt);
 d.sat-=Math.abs(vxl)*(d.v/100)*1.5*dt;
 d.rough=Math.max(0,d.rough-0.8*dt)+unev*dt;
 if(d.rough>2.5&&d.anoppiIn)sayCd('rough',9,pick(L_ROUGH),1,3.2,'a');
 if(ae<-30){if(hasItem('kiuas')&&Math.random()<0.6)sayCd('brake',5,pick(L_KIUAS),2,3.2,'a');else sayCd('brake',5,pick(L_BRAKE),2,3.2,'a');}
 if(d.v>95)hurt('speed',(d.v-95)*0.25*dt);
 meltTime(dt,1);
 // kaarre
 const c=curveAt(d.dist),lat=Math.abs(c)*d.v/100;d.curveNow=Math.abs(c)>1.2;
 if(lat>1.0)hurt('jerk',(lat-1)*3*dt);
 if(lat>1.4)d.sat-=(lat-1.4)*1.5*dt;
 if(lat>1.7){if(hasItem('akvaario'))sayCd('curve',7,'Tuo mureena katsoo minua.',2,3,'a');else sayCd('curve',7,'Hiljempaa kaarteessa, kiitos.',1,3,'a');}
 d.sat-=Math.max(0,ja-14)*0.15*dt;
 if(ja<6)d.sat=Math.min(d.satMax,d.sat+0.3*dt);
 // energia
 d.loadF=1+carriedWt()/40;const vr=d.v/80;
 if(E){
  let dr=(0.12+0.5*vr*vr)*d.loadF*d.roundF+Math.max(0,ae)*0.04+Math.max(0,slope)*0.5*vr;
  let rg=0;if(ae<0)rg+=Math.min(1.5,-ae*0.02);if(slope<0)rg+=-slope*0.4*vr;
  if(d.v<0.5)dr=0;
  d.batt=clamp(d.batt-(dr-rg)*dt,0,100);
  if(d.batt<=0){setMode('h');speak('Akku loppui. Hybridi hoitaa.',2.6,2,'o');}
 }else{
  d.fuel+=(dm/1000)*0.065*d.loadF*(d.batt>5&&s>0.3?0.8:1);
  d.batt=clamp(d.batt+Math.min(0.8,Math.max(0,-ae)*0.012)*dt-(d.batt>0&&s>0.4?0.25*s*dt:0),0,100);
 }
 // anopin satunnaiset kommentit
 if(d.anoppiIn&&d.t>d.noteT){d.noteT=d.t+rnd(18,30);const an=G.pieces.find(p=>p.anoppi);sayCd('idle',10,an&&an.loc==='seat'?pick(L_SEAT):pick(L_TRUNK),0,3,'a');}
 // muut autot
 d.spawnT-=dt;
 if(d.spawnT<=0){d.spawnT=rnd(1.0,3.2)*Math.max(0.55,1-G.round*0.05);d.cars.push({t:'onc',lat:-0.5,dist:d.dist+rnd(1100,1250),v:rnd(100,140),spec:pickCar(),asked:false,hit:false});}
 const nx=d.stopIdx<3?d.stopDists[d.stopIdx]:d.endDist;
 d.slowT-=dt;
 if(d.slowT<=0){
  d.slowT=rnd(7,13)*Math.max(0.6,1-G.round*0.04);
  const sp=pick(SLOWTYPES);const dd=d.dist+rnd(1000,1200);
  if(nx-dd>500||nx<d.dist){
   d.cars.push({t:'slow',lat:0.5,dist:dd,v:sp.kmh*VS,kmh:sp.kmh,spec:sp,said:false});
   if(Math.random()<0.35){const sp2=pick(SLOWTYPES);d.cars.push({t:'slow',lat:0.5,dist:dd+rnd(70,130),v:sp2.kmh*VS,kmh:sp2.kmh,spec:sp2,said:true});}
  }
 }
 // pujottelija: leikkaa eteen omalle kaistalle
 d.cutT-=dt;
 if(d.cutT<=0){
  d.cutT=rnd(16,28);
  if(d.v>45&&d.carX>0.05){
   const dd=d.dist+rnd(180,260);
   if(nx-dd>400||nx<d.dist){const kmh=Math.max(25,d.v-rnd(30,45));d.cars.push({t:'slow',cut:1,age:0,lat:0.5,dist:dd,v:kmh*VS,kmh,spec:{e:'🚙',n:'Pujottelija',col:'#c0392b'},said:true});speak('Pujottelija! Jarruta!',2.4,5,'o');sfx('warn');}
  }
 }
 for(let i=d.cars.length-1;i>=0;i--){
  const c=d.cars[i];
  if(c.cut){c.age+=dt;if(c.age>5){c.kmh+=25*dt;c.v=c.kmh*VS;}}
  if(c.t==='onc')c.dist-=c.v*dt;else c.dist+=c.v*dt;
  const rel=c.dist-d.dist;
  if(c.t==='onc'){
   if(c.spec.white&&!c.asked&&rel<760&&rel>0){c.asked=true;heikkiAsk();}
   if(!c.hit&&Math.abs(rel)<22&&d.carX<0.1){c.hit=true;finishFail('Nokkakolari! Klapit lensivät joka puolelle.');return;}
   if(!c.hit&&rel<22&&rel>-22&&d.carX<0.5&&!c.passed){c.passed=true;sfx('pass');}
   if(rel<-120)d.cars.splice(i,1);
  }else{
   if(!c.said&&rel<700&&rel>0){c.said=true;sayCd('slow',8,'Taas '+c.spec.n.toLowerCase()+' edessä. Ohitetaanko?',1,3,'o');}
   if(!c.crashed&&rel>0&&rel<10&&d.carX>0.05&&d.v>c.kmh+25){c.crashed=true;hurt('jerk',30);d.sat-=20;d.shake=1;sfx('crash');d.v=c.kmh;speak('Oho, kolahti.',2.6,5,'a');}
   if(rel<-150||rel>2200)d.cars.splice(i,1);
  }
 }
 // pysäkki / maali
 const target=nx;
 if(d.dist>=target){
  if(d.stopIdx<3)arriveStop();else{finishWin();return;}
 }
 // tappioehdot
 for(const h of d.hz){if(h.val<=0){finishFail(h.p.haz.fail);return;}}
 if(d.anoppiIn&&d.sat<=0){finishFail('Anoppi jäi kyydistä pois ja kävelee kotiin.');return;}
 d.shake=Math.max(0,d.shake-dt*2.5);
}

function arriveStop(){
 const d=D,store=STORES[d.stopNames[d.stopIdx]];
 let bad=false;
 if(d.v>12){bad=true;}
 if(d.carX<0.1){bad=true;}
 if(bad){d.sat-=15;hurt('jerk',20);D.hz.forEach(h=>{if(h.p.haz.t==='time')h.val-=8;});sfx('crash');}
 d.v=0;d.slider=0;d.gasId=null;d.brakeId=null;d.gasP=0;d.brakeP=0;d.carX=0.5;d.lane=0.5;d.cars=[];
 // tarjoukset
 G.pieces=G.pieces.filter(p=>!p.offer);
 const nOff=1+(G.round>=3?1:0);
 const ids=shuffle(store.pool.slice()).slice(0,nOff);
 const offers=ids.map(id=>mk(ITEMS[id],{id,offer:1}));
 offers.forEach(o=>G.pieces.push(o));
 G.offers=offers;G.store=store;G.stopT=0;
 const first=d.stopIdx===0;
 if(first){G.pieces.push(mk(ITEMS.anoppi,{id:'anoppi'}));}
 // viesti
 const senders=SENDERS.filter(s=>!(first&&s==='Anoppi'));
 const snd=pick(senders);G.sender=snd;
 const names=offers.map(o=>o.n.toLowerCase()).join(' ja ');
 let m;
 if(snd==='Vaimo')m='Vaimo: "'+store.at+' on tarjouksessa '+names+'. Hae ne mukaan!"';
 else if(snd==='Jouni')m='Jouni: "Kun kerran '+store.at+' käyt, tuo '+names+'."';
 else if(snd==='Anoppi')m='Anoppi: "'+store.at+' pitäisi saada '+names+'."';
 else m='Heikki (Orivedeltä): "Hae '+names+' '+store.at+', ei kestä."';
 G.msg=[m];
 if(first)G.msg.push('Anoppi odottaa kaupan edessä. Hän tulee kyytiin.');
 // takakontti menee sekaisin
 jumble(offers);
 G.state='stop';sfx('msg');
}
function jumble(offers){
 const olds=G.pieces.filter(p=>p.loc==='grid');
 const saved=olds.map(p=>({p,x:p.x,y:p.y,w:p.w,h:p.h}));
 for(let at=0;at<40;at++){
  olds.forEach(p=>{p.loc='tray';});
  let ok=true;
  for(const p of shuffle(olds.slice())){
   const c=[];const w0=p.w,h0=p.h;
   for(let r=0;r<2;r++){p.w=r?h0:w0;p.h=r?w0:h0;if(r&&w0===h0)continue;for(let y=0;y<GR;y++)for(let x=0;x<GC;x++)if(fitsGrid(p,x,y))c.push([x,y,p.w,p.h]);}
   if(!c.length){ok=false;p.w=w0;p.h=h0;break;}
   const s=pick(c);p.loc='grid';p.x=s[0];p.y=s[1];p.w=s[2];p.h=s[3];
  }
  if(ok&&!offers.every(anyFit))return;
  if(ok&&at===39)return;
 }
 saved.forEach(s=>{s.p.loc='grid';s.p.x=s.x;s.p.y=s.y;s.p.w=s.w;s.p.h=s.h;});
}
function leaveStop(skip){
 const d=D;
 if(skip){d.offerSkips++;G.pieces=G.pieces.filter(p=>!p.offer);}
 else{d.offersDone+=G.offers.length;G.pieces.forEach(p=>{if(p.offer)p.offer=0;});}
 G.offers=[];d.stopIdx++;d.v=0;
 // pois jätetyt tavarat pois seurannasta, uudet vaaralliset mukaan
 G.pieces=G.pieces.filter(p=>isPlaced(p)||p.must||p.anoppi);
 d.hz=d.hz.filter(h=>isPlaced(h.p));
 carried().forEach(p=>{if(p.haz&&!d.hz.some(h=>h.p===p))d.hz.push({p,val:100});});
 const an=G.pieces.find(p=>p.anoppi&&isPlaced(p));
 if(an&&!d.anoppiIn){d.anoppiIn=true;d.sat=100;d.noteT=d.t+10;}
 G.state='drive';
 if(skip)speak(G.sender+' ei tästä ilahdu...',2.8,3,'o');
 else if(an&&d.stopIdx===1)speak('Anoppi kyydissä. Hän tuntuu tyytyväiseltä.',3,2,'o');
 else speak('Hyvä. Nyt eteenpäin!',2.4,2,'o');
}
function updateStop(dt){
 G.stopT+=dt;D.clock+=dt;
 meltTime(dt,1.6);
 for(const h of D.hz){if(h.val<=0){finishFail(h.p.haz.fail);return;}}
}

function mmss(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function finishFail(reason){G.state='result';sfx('fail');G.result={win:false,reason};if(D)D.v=0;}
function finishWin(){
 const d=D;
 const car=carried();
 const load=car.reduce((s,p)=>s+p.wt,0)*12;
 const pack=packQuality();
 const fuelB=Math.round(clamp(300*(1-d.fuel/0.9),0,300));
 const master0=d.fuel<0.0005;
 const intact=Math.round(d.hz.reduce((s,h)=>s+clamp(h.val,0,100)*1.2,0));
 const anop=d.anoppiIn?Math.round(clamp(d.sat,0,100)*1.5):-250;
 const shop=d.offersDone*60-d.offerSkips*40;
 const bonus=master0?100:0;
 const klapit=car.some(p=>p.must)?150:0;
 const timeB=Math.round(clamp(250-(d.clock-(d.par-40))*4,-120,250));
 const total=load+pack+fuelB+bonus+intact+anop+shop+klapit+timeB;
 const stars=total>=1100?3:total>=850?2:1;
 let newBest=false;
 if(total>G.best){G.best=total;newBest=true;lsSet(BEST_KEY,String(total));}
 const avg=d.km>0?d.fuel/d.km*100:0;
 const jouni=stars===3?'Jouni: "Klapit tuli. Ja kaikki muukin. Kiitos!"':stars===2?'Jouni: "Klapit tuli. Mitä ihmettä nuo muut on?"':'Jouni: "Noh, klapit ainakin tuli."';
 G.result={win:true,total,stars,newBest,avg,master0,jouni,lines:[['Kuorma',load],['Pakkaus',pack],['Bensa',fuelB+bonus],['Ehjät tavarat',intact],['Anopin tyytyväisyys',anop],['Kaupat',shop],['Klapit Jounille',klapit],['Aika '+mmss(d.clock),timeB]]};
 G.state='result';sfx('win');d.v=0;
}

let drag=null,trayPos=new Map();
const PED={brake:{x:14,y:562,w:116,h:150},gas:{x:230,y:562,w:116,h:150}};
const inR=(p,r)=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/sc,y:(e.clientY-r.top)/sc};}
function pieceRect(p){if(p.loc==='grid')return{x:GX+p.x*CS,y:GY+p.y*CS};if(p.loc==='seat')return{x:SX+p.x*CS,y:SY+p.y*CS};return trayPos.get(p)||null;}
function pickPiece(pos){
 for(let i=G.pieces.length-1;i>=0;i--){const p=G.pieces[i];if(p.loc==='drag')continue;const r=pieceRect(p);if(!r)continue;if(pos.x>=r.x&&pos.x<=r.x+p.w*CS&&pos.y>=r.y&&pos.y<=r.y+p.h*CS)return p;}
 return null;
}
function onDown(pos,id){
 if(pos.x>=322&&pos.x<=356&&pos.y>=6&&pos.y<=40){setMute(!muted);return;}
 for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h){b.fn();return;}}
 if(G.state==='pack'||G.state==='stop'){
  const p=pickPiece(pos);
  if(p){const r=pieceRect(p);drag={p,id,ox:pos.x-r.x,oy:pos.y-r.y,x:pos.x,y:pos.y,sx:pos.x,sy:pos.y,t0:performance.now(),moved:false,prev:{loc:p.loc,x:p.x,y:p.y,w:p.w,h:p.h}};p.loc='drag';}
 }else if(G.state==='drive'){
  if(inR(pos,PED.brake))D.brakeId=id;
  else if(inR(pos,PED.gas))D.gasId=id;
  else if(pos.y>=130&&pos.y<478)D.lane=pos.x<180?-0.5:0.5;
 }
}
function onMove(pos,id){
 if(drag&&drag.id===id){drag.x=pos.x;drag.y=pos.y;if(Math.hypot(pos.x-drag.sx,pos.y-drag.sy)>8)drag.moved=true;}
}
function onUp(id){
 if(D){if(D.gasId===id)D.gasId=null;if(D.brakeId===id)D.brakeId=null;}
 if(drag&&drag.id===id){
  const p=drag.p,prev=drag.prev;const d=drag;drag=null;
  if(!d.moved&&performance.now()-d.t0<450){
   p.loc=prev.loc;p.x=prev.x;p.y=prev.y;const w=p.w,h=p.h;p.w=h;p.h=w;
   if(prev.loc==='grid'&&!fitsGrid(p,p.x,p.y)){p.w=w;p.h=h;}
   else if(prev.loc==='seat'){p.w=w;p.h=h;}
   else sfx('pop');
   return;
  }
  const tlx=d.x-d.ox,tly=d.y-d.oy;
  const gx=Math.round((tlx-GX)/CS),gy=Math.round((tly-GY)/CS);
  const sx=Math.round((tlx-SX)/CS),sy=Math.round((tly-SY)/CS);
  p.loc='drag';
  if(fitsGrid(p,gx,gy)){p.loc='grid';p.x=gx;p.y=gy;sfx('pop');}
  else if(G.state==='stop'&&seatOk(p,sx,sy,tlx,tly)){p.loc='seat';p.x=p.anoppi?0:sx;p.y=p.anoppi?0:sy;sfx('pop');}
  else if(prev.loc==='tray'){p.loc='tray';}
  else if((!p.must||G.state==='pack')&&!p.anoppi&&d.y>470){p.loc='tray';}
  else{p.loc=prev.loc;p.x=prev.x;p.y=prev.y;p.w=prev.w;p.h=prev.h;}
 }
}
cv.addEventListener('pointerdown',e=>{initAudio();if(AC&&AC.state==='suspended')AC.resume();try{cv.setPointerCapture(e.pointerId);}catch(x){}onDown(pt(e),e.pointerId);e.preventDefault();});
cv.addEventListener('pointermove',e=>{onMove(pt(e),e.pointerId);e.preventDefault();});
cv.addEventListener('pointerup',e=>{onUp(e.pointerId);e.preventDefault();});
cv.addEventListener('pointercancel',e=>{onUp(e.pointerId);});
addEventListener('keydown',e=>{
 if(G.state!=='drive'||!D)return;
 if(e.key==='ArrowUp'||e.key==='w')D.keyGas=true;
 else if(e.key==='ArrowDown'||e.key==='s')D.keyBrake=true;
 else if(e.key==='ArrowLeft'||e.key==='a')D.lane=-0.5;
 else if(e.key==='ArrowRight'||e.key==='d')D.lane=0.5;
 else if(e.key===' '){setMode(D.mode==='e'?'h':'e');e.preventDefault();}
});
addEventListener('keyup',e=>{
 if(!D)return;
 if(e.key==='ArrowUp'||e.key==='w')D.keyGas=false;
 else if(e.key==='ArrowDown'||e.key==='s')D.keyBrake=false;
});

function drawPiece(p,x,y,alpha){
 const w=p.w*CS,h=p.h*CS;ctx.globalAlpha=alpha===undefined?1:alpha;
 rr(x+1,y+1,w-2,h-2,8,p.col,'rgba(0,0,0,0.45)',2);
 if(p.fr){ctx.setLineDash([4,3]);rr(x+4,y+4,w-8,h-8,6,null,'rgba(255,255,255,0.7)',1.5);ctx.setLineDash([]);}
 if(p.anoppi){ctx.strokeStyle='rgba(80,40,100,0.6)';ctx.lineWidth=2;ctx.beginPath();if(h>w){ctx.moveTo(x+w/2,y+8);ctx.lineTo(x+w/2,y+h-8);}else{ctx.moveTo(x+8,y+h/2);ctx.lineTo(x+w-8,y+h/2);}ctx.stroke();}
 const sz=Math.min(26,Math.min(w,h)*0.6);
 const cx=p.anoppi?(h>w?x+w/2:x+w*0.18):x+w/2,cy=p.anoppi?(h>w?y+h*0.25:y+h/2):y+h/2-(w>=2*CS&&h>=2*CS?6:0);
 em(p.e,cx,cy,sz);
 if(p.w*p.h>=2&&!p.anoppi)tx(p.n,x+w/2,y+h-9,9,'rgba(0,0,0,0.75)','center','bold');
 if(p.wt>=3)tx('▼',x+8,y+9,9,'rgba(0,0,0,0.6)');
 ctx.globalAlpha=1;
}
function layoutTray(tX,tY,tW){
 trayPos=new Map();let x=tX,y=tY,rowH=0;
 G.pieces.forEach(p=>{if(p.loc!=='tray')return;const w=p.w*CS;if(x+w>tX+tW&&x>tX){x=tX;y+=rowH+8;rowH=0;}trayPos.set(p,{x,y});x+=w+8;rowH=Math.max(rowH,p.h*CS);});
}
function drawGridArea(){

function Xrel(w,dist){return Xabs(w)-Xabs(dist)-Xd(dist)*(w-dist);}
function buildRoad(){
 const d=D,k0=Math.floor(d.dist/SEGL),pts=[];
 const Ic=Iabs(d.dist);
 for(let j=0;j<=NSEG;j++){
  const wd=(k0+j)*SEGL,z=Z0+(wd-d.dist),s=Z0/z;
  const Y=0.0008*(Iabs(wd)-Ic);
  const sy=YH+KY*s*(1-Y);
  const x=Xrel(wd,d.dist);
  pts.push({z,s,sy,cx:180+(x-d.carX)*RW*s,w:RW*s,wd});
 }
 return {pts,k0};
}
function proj(R,wd,lat){
 const f=wd/SEGL-R.k0;const j=Math.floor(f);if(j<0||j>=NSEG)return null;const t=f-j,a=R.pts[j],b=R.pts[j+1];
 const s=a.s+(b.s-a.s)*t,w=a.w+(b.w-a.w)*t,cx=a.cx+(b.cx-a.cx)*t,sy=a.sy+(b.sy-a.sy)*t;
 return {j,s,w,sy,x:cx+lat*w};
}

 ctx.strokeStyle='#3a4150';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px0,py);ctx.lineTo(px1,py);ctx.stroke();

 for(let i=0;i<3;i++){const sx=px0+(px1-px0)*(d.stopDists[i]/d.endDist);ctx.fillStyle=i<d.stopIdx?'#3ddc84':STORES[d.stopNames[i]].col;ctx.beginPath();ctx.arc(sx,py,5,0,7);ctx.fill();}
 em('🏁',px1+2,py-1,12);
 ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(px0+(px1-px0)*frac,py,4,0,7);ctx.fill();

 // --- kohtaus ---
 ctx.save();ctx.beginPath();ctx.rect(0,130,W,348);ctx.clip();
 const sy0=d.shake>0?(Math.random()-0.5)*6*d.shake:0;ctx.translate(0,sy0);
 const sk=ctx.createLinearGradient(0,130,0,YH);sk.addColorStop(0,'#7fb8de');sk.addColorStop(1,'#d9eef8');ctx.fillStyle=sk;ctx.fillRect(0,130,W,YH-130+2);
 // kaukomäet (liikkuvat suuntaa vaihtaessa)
 const hOff=-Xd(d.dist)*9000;
 ctx.fillStyle='#86b3a0';ctx.beginPath();ctx.moveTo(0,YH+2);
 for(let x=0;x<=W;x+=6){const xx=x+hOff;ctx.lineTo(x,YH-18-14*Math.sin(xx/55)-9*Math.sin(xx/23+1));}
 ctx.lineTo(W,YH+2);ctx.closePath();ctx.fill();
 ctx.fillStyle='#6fa07f';ctx.beginPath();ctx.moveTo(0,YH+2);
 for(let x=0;x<=W;x+=6){const xx=x+hOff*1.8;ctx.lineTo(x,YH-6-8*Math.sin(xx/37+2)-5*Math.sin(xx/17));}
 ctx.lineTo(W,YH+2);ctx.closePath();ctx.fill();
 ctx.fillStyle='#5f9e48';ctx.fillRect(0,YH,W,YB-YH+10);

 const R=buildRoad(),pts=R.pts,k0=R.k0;
 // spritet segmentteihin
 const bucket=[];for(let j=0;j<NSEG;j++)bucket.push([]);
 const addS=(wd,lat,o)=>{const f=wd/SEGL-k0;const j=Math.floor(f);if(j>=0&&j<NSEG)bucket[j].push({wd,lat,o});};
 d.cars.forEach(c=>addS(c.dist,c.lat,c));
 const nextTarget=d.stopIdx<3?d.stopDists[d.stopIdx]:d.endDist;
 addS(nextTarget,1.9,{t:d.stopIdx<3?'store':'finish'});

 for(let j=NSEG-1;j>=0;j--){
  const a=pts[j],b=pts[j+1];
  const idx=k0+j;
  if(b.sy>a.sy+1&&j<NSEG-1)continue;
  ctx.fillStyle=(idx%2)?'#5c9f46':'#66ab4f';ctx.fillRect(0,b.sy,W,Math.max(1,a.sy-b.sy+1));
  poly([[b.cx-b.w*1.1,b.sy],[b.cx+b.w*1.1,b.sy],[a.cx+a.w*1.1,a.sy],[a.cx-a.w*1.1,a.sy]],(idx%4<2)?'#c33':'#eee');
  poly([[b.cx-b.w,b.sy],[b.cx+b.w,b.sy],[a.cx+a.w,a.sy],[a.cx-a.w,a.sy]],(idx%2)?'#3b3e46':'#42454e');
  if(idx%4<2)poly([[b.cx-b.w*0.02,b.sy],[b.cx+b.w*0.02,b.sy],[a.cx+a.w*0.02,a.sy],[a.cx-a.w*0.02,a.sy]],'#e8e8e8');
  // reunapuut
  const hv=hash(idx);
  if(hv>0.55){const side=hash(idx+3)>0.5?1:-1,lat=side*(1.5+hash(idx+9)*2.4);const x=a.cx+lat*a.w,sz=Math.min(160,70*a.s);if(sz>3)em(hv<0.7?'🌳':'🌲',x,a.sy-sz*0.35,sz);}
  bucket[j].forEach(sp=>{
   const p=proj(R,sp.wd,sp.lat);if(!p)return;
   const o=sp.o,w=Math.min(300,120*p.s);
   if(o.t==='onc'){drawCarFront(p.x,p.sy,w,o.spec);}
   else if(o.t==='slow'){drawSlowRear(p.x,p.sy,w,o.spec);}
   else if(o.t==='store'){drawStoreSprite(p.x,p.sy,Math.min(300,170*p.s),STORES[d.stopNames[d.stopIdx]]);}
   else if(o.t==='finish'){const bw=170*p.s;rr(p.x-bw*0.5,p.sy-bw*0.7,bw,bw*0.3,4,'#fff','#222',1.5);tx('NIKKILÄ',p.x,p.sy-bw*0.55,Math.max(6,bw*0.16),'#222','center','bold');}
  });
 }
 // oma auto
 const brake=d.slider<-0.05;
 if(d.t<12){ctx.globalAlpha=0.75;tx('Napauta tietä: vasen = ohitus, oikea = oikea kaista',180,330,11,'#fff','center','bold');ctx.globalAlpha=1;}
 const lean=-curveAt(d.dist)*0.012*(d.v/100)+(d.lane-d.carX)*0.04;
 drawPassatRear(180,YB-2,lean,brake);

 // varoitukset
 const onc=d.cars.find(c=>c.t==='onc'&&c.dist-d.dist>0&&c.dist-d.dist<650);
 const nextStopRel=nextTarget-d.dist;
 let bn=null;
 if(d.carX<0&&onc){bn=['⚠️ VASTAANTULIJA! Takaisin oikealle','#d33'];}
 else if(d.stopIdx<3&&nextStopRel<800){bn=['PYSÄHDY OIKEALLA: '+STORES[d.stopNames[d.stopIdx]].n+' '+Math.round(nextStopRel)+' m','#1f5fa8'];}
 else if(d.curveNow&&d.v>70){bn=['↪ Kaarre – hiljempaa','#c77d00'];}
 if(bn&&(Math.floor(performance.now()/300)%2===0||!(d.carX<0&&onc))){rr(40,138,280,24,8,bn[1]);tx(bn[0],180,150,12,'#fff','center','bold');}
 // puhekupla
 if(d.bubble){
  const lines=wrap(d.bubble.text,236,14,'bold');const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+54,bh=lines.length*18+14;
  const bx=d.bubble.who==='o'?W-bw-8:8,by=172;
  rr(bx,by,bw,bh,12,d.bubble.who==='o'?'#e6f2ff':'#fff','#222',2);
  em(d.bubble.who==='o'?'🧔':'👵',bx+20,by+bh/2,20);
  lines.forEach((l,i)=>tx(l,bx+38,by+13+i*18,14,'#222','left','bold'));
 }
 ctx.restore();

 // --- ohjaimet ---
 ctx.fillStyle='#161b24';ctx.fillRect(0,478,W,242);
 const E=d.mode==='e';
 button('⚡ SÄHKÖ',14,486,166,48,E?'#1f7a4a':'#3a4150',()=>setMode('e'),{size:17});
 button('⛽ HYBRID',186,486,160,48,!E?'#b36b12':'#3a4150',()=>setMode('h'),{size:17});
 tx(E?'hiljainen · max 110 km/h · ei bensaa':'nopea · pääosin bensaa · akku auttaa',180,548,10,'#8a93a3','center');
 drawPedal(PED.brake,'JARRU',d.brakeP,'#c0392b');
 drawPedal(PED.gas,'KAASU',d.gasP,E?'#2fa35f':'#d0821c');
 tx('Kuorma: '+carriedWt(),180,586,11,'#8a93a3','center');
 drawGauge(180,692,40);
 drawMute();
}

// ====== piirto: tulos ======
function renderResult(){
 const r=G.result;
 ctx.fillStyle=r.win?'#10261a':'#2a1414';ctx.fillRect(0,0,W,H);
 if(r.win){
  tx('Perillä Nikkilässä!',W/2,52,26,'#fff','center','bold');
  tx('★'.repeat(r.stars)+'☆'.repeat(3-r.stars),W/2,100,44,'#ffd166','center');
  tx(r.jouni,W/2,142,12,'#c9d1dc','center');
  let y=176;
  r.lines.forEach(l=>{tx(l[0],40,y,15,'#c9d1dc');tx((l[1]>0?'+':'')+l[1],320,y,15,l[1]<0?'#ff8a8a':'#fff','right','bold');y+=28;});
  ctx.fillStyle='#3a4150';ctx.fillRect(40,y-8,280,2);
  tx('Yhteensä',40,y+14,20,'#fff','left','bold');tx(String(r.total),320,y+14,22,'#ffd166','right','bold');
  y+=50;
  tx('Kulutus: '+fmt(r.avg,1)+' l/100 km',W/2,y,14,r.master0?'#3ddc84':'#c9d1dc','center','bold');y+=24;
  if(r.master0){tx('Kulutusmestari! 0,0 l/100 km',W/2,y,15,'#3ddc84','center','bold');y+=24;}
  if(r.newBest)tx('Uusi ennätys!',W/2,y,18,'#ffd166','center','bold');
  else tx('Ennätys: '+G.best,W/2,y,14,'#8a93a3','center');
  tx(r.stars===3?'Anoppi: "Ihan kiva kyyti. Vähän ahdasta."':r.stars===2?'Anoppi: "Ihan kelpo. Heikki olisi ajanut toisin."':'Anoppi: "Perillä ollaan. Tämä riittää."',W/2,y+34,13,'#c9d1dc','center');
  button('SEURAAVA KIERROS',50,610,260,50,'#2fa35f',()=>{G.round++;startRound();},{size:17});
  button('Alkuun',110,668,140,36,'#3a4150',()=>{G.state='title';},{size:14});
 }else{
  tx('Peli ohi',W/2,90,32,'#ff8a8a','center','bold');
  const lines=wrap(r.reason,300,17,'bold');
  lines.forEach((l,i)=>tx(l,W/2,170+i*26,17,'#fff','center','bold'));
  em('🪵',W/2,300,60);
  button('YRITÄ UUDELLEEN',50,560,260,56,'#c0392b',()=>startRound(),{size:18});
  button('Alkuun',110,630,140,38,'#3a4150',()=>{G.state='title';},{size:14});
 }
 drawMute();
}

// ====== silmukka ======
let last=performance.now();
function frame(t){
 const dt=Math.min(0.05,Math.max(0,(t-last)/1000));last=t;
 if(G.state==='drive')updateDrive(dt);else if(G.state==='stop')updateStop(dt);
 humUpdate();
 ctx.setTransform(sc*dpr,0,0,sc*dpr,0,0);
 BTN=[];
 ctx.clearRect(0,0,W,H);
 if(G.state==='title')renderTitle();
 else if(G.state==='pack')renderPack();
 else if(G.state==='stop')renderStop();
 else if(G.state==='drive')renderDrive();
 else if(G.state==='result')renderResult();
 requestAnimationFrame(frame);
}
if(window.__TEST)window.__TEST.api={G,getD:()=>D,startRound,startDrive,updateDrive,updateStop,leaveStop,frame,onDown,onUp,onMove,setMode,PED,genRound,packQuality,fitsGrid,fitsSeat,reqOk,isPlaced};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
